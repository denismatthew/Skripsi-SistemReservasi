<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Servis - DIPO</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo"><a href="index.html">DIPO</a></div>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#layanan">Layanan</a></li>
                    <li><a href="index.html#tentang">Tentang</a></li>
                    <li><a href="index.html#kontak">Kontak</a></li>
                </ul>

                <div class="user-menu">
                    <!-- Show when NOT logged in -->
                    <a href="login.html" class="btn-login" id="btnLogin">Login</a>
                    
                    <!-- Show when logged in -->
                    <div class="user-dropdown" id="userDropdown" style="display: none;">
                        <button class="user-button" id="userButton">
                            <span class="user-icon"><i class="bi bi-person-circle"></i></span>
                            <span class="user-name" id="userName">User</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="customer/dashboard.html" class="dropdown-item">
                                <span class="item-icon"><i class="bi bi-clock-history"></i></span> My Booking
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item" id="btnLogout">
                                <span class="item-icon"><i class="bi bi-box-arrow-right"></i></span> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Booking Form Section -->
    <section class="booking-section">
        <div class="booking-container">
            <div class="booking-header">
                <h1>Booking Servis Kendaraan</h1>
                <p>Isi form di bawah untuk menjadwalkan servis kendaraan Anda</p>
            </div>

            <form class="booking-form" id="bookingForm">
                <!-- Model Kendaraan -->
                <div class="form-group">
                    <label for="modelKendaraan">Model Kendaraan <span class="required">*</span></label>
                    <input type="text" id="modelKendaraan" name="modelKendaraan" placeholder="Mitsubishi Mirage" required>
                    <!-- <select id="modelKendaraan" name="modelKendaraan" required>
                        <option value="">-- Pilih Model Kendaraan --</option>
                        <option value="Mitsubishi DESTINATOR">Mitsubishi DESTINATOR</option>
                        <option value="Mitsubishi XForce">Mitsubishi XForce</option>
                        <option value="Mitsubishi Xpander">Mitsubishi Xpander</option>
                        <option value="Mitsubishi Xpander Cross">Mitsubishi Xpander Cross</option>
                        <option value="Mitsubishi Pajero Sport">Mitsubishi Pajero Sport</option>
                    </select> -->
                </div>

                <!-- Nomor Polisi -->
                <div class="form-group">
                    <label for="nomorPolisi">Nomor Polisi <span class="required">*</span></label>
                    <input type="text" id="nomorPolisi" name="nomorPolisi" placeholder="Contoh: B 1234" required>
                </div>

                <!-- Kilometer -->
                <div class="form-group">
                    <label for="kilometer">Kilometer <span class="required">*</span></label>
                    <input type="number" id="kilometer" name="kilometer" placeholder="Contoh: 50000" min="0" required>
                </div>

                <!-- Tanggal & Jam (Grid 2 kolom) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="tanggalBooking">Tanggal Booking <span class="required">*</span></label>
                        <input type="date" id="tanggalBooking" name="tanggalBooking" required>
                    </div>

                    <div class="form-group">
                        <label for="jamBooking">Jam Booking <span class="required">*</span></label>
                        <select id="jamBooking" name="jamBooking" required>
                            <option value="">-- Pilih Jam --</option>
                            <option value="08:00">08:00</option>
                            <option value="08:30">08:30</option>
                            <option value="09:00">09:00</option>
                            <option value="09:30">09:30</option>
                            <option value="10:00">10:00</option>
                            <option value="10:30">10:30</option>
                            <option value="11:00">11:00</option>
                            <option value="11:30">11:30</option>
                            <option value="12:00">12:00</option>
                            <option value="12:30">12:30</option>
                            <option value="13:00">13:00</option>
                            <option value="13:30">13:30</option>
                            <option value="14:00">14:00</option>
                            <option value="14:30">14:30</option>
                            <option value="15:00">15:00</option>
                            <option value="15:30">15:30</option>
                            <option value="16:00">16:00</option>
                        </select>
                    </div>
                </div>

                <!-- Kerusakan/Keluhan -->
                <div class="form-group">
                    <label for="keluhan">Kerusakan/Keluhan <span class="required">*</span></label>
                    <textarea id="keluhan" name="keluhan" rows="5" placeholder="Jelaskan kerusakan atau keluhan kendaraan Anda..." required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-submit">Submit Booking</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer id="kontak">
        <p>&copy; 2025 DIPO. All rights reserved.</p>
        <p><i class="bi bi-envelope"></i> contact@dipo.com | <i class="bi bi-telephone"></i> +62 812-3456-7890</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">FAQ</a>
        </div>
    </footer>

    <script src="../script/booking.js"></script>
</body>
</html>
