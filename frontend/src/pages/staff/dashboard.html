<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - DIPO</title>
    <link rel="stylesheet" href="../../styles/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>DIPO</h2>
                <p class="admin-badge" id="staffRoleBadge">STAFF</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-icon"><i class="bi bi-graph-up"></i></span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="my-tasks.html" class="nav-item">
                    <span class="nav-icon"><i class="bi bi-clipboard-data"></i></span>
                    <span class="nav-text">My Tasks</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" id="btnStaffLogout">
                    <span class="nav-icon"><i class="bi bi-box-arrow-right"></i></span>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-left">
                    <h1>Dashboard</h1>
                    <p class="breadcrumb">Home / Dashboard</p>
                </div>
                <div class="header-right">
                    <div class="admin-profile">
                        <span class="profile-icon"><i class="bi bi-person-circle"></i></span>
                        <div class="profile-info">
                            <p class="profile-name" id="staffName">Staff</p>
                            <p class="profile-email" id="staffEmail">staff@staff.dipo.co</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                <div class="tabs-container">
                    <button class="tab-btn" id="tabTechnician" data-tab="technician">
                        <i class="bi bi-wrench"></i> Booking Servis
                    </button>
                    <button class="tab-btn" id="tabSales" data-tab="sales">
                        <i class="bi bi-car-front"></i> Booking Test Drive
                    </button>
                </div>

                <!-- Tab Content: Technician (Booking Servis) -->
                <div class="tab-content" id="tab-technician">
                    <!-- Filter -->
                    <div class="filter-section">
                        <div class="search-group">
                            <input type="text" id="searchServis" class="search-input" placeholder="Cari nomor polisi atau nama...">
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Tanggal</th>
                                    <th>Jam</th>
                                    <th>Customer</th>
                                    <th>Model Kendaraan</th>
                                    <th>Nomor Polisi</th>
                                    <th>Keluhan</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableServis"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Tab Content: Sales (Booking Test Drive) -->
                <div class="tab-content" id="tab-sales">
                    <!-- Filter -->
                    <div class="filter-section">
                        <div class="search-group">
                            <input type="text" id="searchTestDrive" class="search-input" placeholder="Cari mobil atau nama...">
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tanggal</th>
                                    <th>Jam</th>
                                    <th>Customer</th>
                                    <th>Mobil Pilihan</th>
                                    <th>Nomor Polisi</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableTestDrive"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../script/staff-dashboard.js"></script>
</body>
</html>
