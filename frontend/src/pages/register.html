<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - DIPO</title>
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Side - Image -->
        <div class="auth-left register-bg">
            <div class="auth-overlay">
                <div class="auth-branding">
                    <h1><a href = "index.html">DIPO</a></h1>
                    <p>Bergabunglah dan nikmati kemudahan booking servis & test drive</p>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Buat Akun Baru</h2>
                    <p>Daftar untuk mulai booking servis & test drive</p>
                </div>

                <form class="auth-form" id="registerForm">
                    <!-- Nama Lengkap -->
                    <div class="form-group">
                        <label for="namaLengkap">Nama Lengkap</label>
                        <input 
                            type="text" 
                            id="namaLengkap" 
                            name="nama" 
                            placeholder="Masukkan nama lengkap" 
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="emailRegister">Email</label>
                        <input 
                            type="email" 
                            id="emailRegister" 
                            name="email" 
                            placeholder="nama@email.com" 
                            required
                        >
                    </div>

                    <!-- No. Telepon -->
                    <div class="form-group">
                        <label for="noTelepon">No. Telepon</label>
                        <input 
                            type="tel" 
                            id="noTelepon" 
                            name="phoneNo" 
                            placeholder="08123456789" 
                            required
                        >
                    </div>

                    <!-- Alamat -->
                    <div class="form-group">
                        <label for="Alamat">Alamat</label>
                        <input 
                            type="text" 
                            id="Alamat" 
                            name="address"
                            placeholder="Jl. Melati No 2" 
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="passwordRegister">Password</label>
                        <input 
                            type="password" 
                            id="passwordRegister" 
                            name="password" 
                            placeholder="Minimal 8 karakter" 
                            required
                        >
                    </div>

                    <!-- Konfirmasi Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Ulangi password" 
                            required
                        >
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-auth">Daftar</button>
                </form>

                <!-- Login Link -->
                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="login.html">Login sekarang</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/auth.js"></script>
</body>
</html>
